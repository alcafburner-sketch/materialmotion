name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rootless
            theos_repo: theos/theos
            scheme: rootless
          - name: roothide
            theos_repo: roothide/theos
            scheme: roothide
          - name: rootful
            theos_repo: theos/theos
            scheme: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos (${{ matrix.theos_repo }})
        run: |
          git clone --recursive --depth 1 https://github.com/${{ matrix.theos_repo }} "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: MaterialMotion-${{ matrix.name }}
          path: packages/*.deb
          if-no-files-found: error
